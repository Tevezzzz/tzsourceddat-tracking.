# tzsourceddat-tracking.
A tracking website for my reselling business TzSourcedDat 

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TzSourcedDat | Track Order</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #080b0a;
      color: white;
      font-family: Arial, sans-serif;
      padding: 24px 16px;
    }
    .container {
      max-width: 440px;
      margin: 40px auto;
      padding: 26px 20px;
      background: #111713;
      border: 1px solid #263a2c;
      border-radius: 18px;
    }
    .logo {
      color: #39e879;
      font-size: 27px;
      font-weight: 900;
      text-align: center;
    }
    .tagline {
      color: #9ca99f;
      font-size: 11px;
      text-align: center;
      letter-spacing: 3px;
      margin: 8px 0 30px;
    }
    h1 { font-size: 25px; margin-bottom: 8px; }
    p { color: #b9c4bc; line-height: 1.5; }
    label { display: block; margin: 18px 0 7px; }
    input {
      width: 100%;
      padding: 14px;
      background: #202923;
      border: 1px solid #35453a;
      border-radius: 8px;
      color: white;
      font-size: 16px;
    }
    button {
      width: 100%;
      margin-top: 20px;
      padding: 15px;
      background: #39e879;
      border: 0;
      border-radius: 8px;
      color: #061009;
      font-size: 16px;
      font-weight: bold;
    }
    button:disabled { opacity: .6; }
    #message { margin-top: 20px; overflow-wrap: anywhere; }
    .result {
      margin-top: 18px;
      padding: 16px;
      background: #202923;
      border-radius: 10px;
      line-height: 1.8;
      overflow-wrap: anywhere;
    }
    .status { color: #39e879; font-weight: bold; }
    a { color: #39e879; }
    footer {
      margin-top: 30px;
      text-align: center;
      color: #849087;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <main class="container">
    <div class="logo">TzSourcedDat</div>
    <div class="tagline">BUY · SELL · SOURCE</div>

    <h1>Track your order</h1>
    <p>Enter the order number and tracking code we gave you.</p>

    <form id="trackingForm">
      <label for="order">Order number</label>
      <input id="order" required autocomplete="off"
        placeholder="Enter order number">

      <label for="code">Tracking code</label>
      <input id="code" required autocomplete="off"
        placeholder="Enter tracking code">

      <button id="trackButton" type="submit">Track order</button>
    </form>

    <div id="message" role="status" aria-live="polite"></div>
    <footer>© TzSourcedDat · Order Tracking</footer>
  </main>

  <script>
    const SUPABASE_URL =
      "https://jsebwhhgcorttueelvfo.supabase.co";

    // Replace this placeholder with your Supabase publishable key.
    const SUPABASE_KEY = "sb_publishable_BdLm9WR-DkVoSTVOQdPQ_Q_CbEuZmpM";

    const form = document.getElementById("trackingForm");
    const button = document.getElementById("trackButton");
    const message = document.getElementById("message");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();

      const orderNumber = document.getElementById("order").value.trim();
      const trackingCode = document.getElementById("code").value.trim();

      if (SUPABASE_KEY.includes("PASTE_YOUR")) {
        message.textContent =
          "Setup needed: add your Supabase publishable key to the code.";
        return;
      }

      button.disabled = true;
      button.textContent = "Checking order...";
      message.textContent = "";

      try {
        const response = await fetch(
          SUPABASE_URL + "/rest/v1/rpc/track_tzsourceddat_order",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            },
            body: JSON.stringify({
              p_order_number: orderNumber,
              p_tracking_code: trackingCode
            })
          }
        );

        const data = await response.json();

        if (!response.ok) {
          throw new Error("Tracking service unavailable. Please try again.");
        }

        const result = Array.isArray(data) ? data[0] : data;

        if (!result || result.error || result.found === false) {
          message.textContent =
            "Order not found. Check your order number and tracking code.";
          return;
        }

        if (result.success === false || result.message) {
          message.textContent =
            result.message || "Order not found. Check your details.";
          return;
        }

        const card = document.createElement("div");
        card.className = "result";

        function addLine(label, value, className) {
          if (value === null || value === undefined || value === "") return;
          const line = document.createElement("div");
          const name = document.createElement("strong");
          name.textContent = label + ": ";
          const text = document.createElement("span");
          text.textContent = String(value);
          if (className) text.className = className;
          line.append(name, text);
          card.appendChild(line);
        }

        addLine("Order", result.order_number);
        addLine("Item", result.item_name);
        addLine("Status", result.status, "status");
        addLine("Courier", result.courier);
        addLine("Estimated delivery", result.estimated_delivery);

        if (result.courier_tracking_url) {
          const link = document.createElement("a");
          link.href = result.courier_tracking_url;
          link.target = "_blank";
          link.rel = "noopener noreferrer";
          link.textContent = "Track with courier";
          card.appendChild(link);
        }

        if (!card.childNodes.length) {
          message.textContent =
            "The tracking response format needs checking.";
          return;
        }

        message.replaceChildren(card);
      } catch (error) {
        message.textContent =
          error.message || "Could not check the order. Please try again.";
      } finally {
        button.disabled = false;
        button.textContent = "Track order";
      }
    });
  </script>
</body>
</html>
